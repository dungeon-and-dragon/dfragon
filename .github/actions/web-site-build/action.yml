name: Web site build
description: Builds apps/web from the checked-out dfragon commit and uploads it as the dfragon.com Pages artifact.

runs:
  using: composite
  steps:
    # The web app's OCR needs the pinned fine-tuned model. The site never loads the score engine submodule.
    - shell: bash
      run: git submodule update --init --depth 1 packages/models/ocr-finetuned
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        # The deployed site must not be built from package caches that other runs could have written.
        package-manager-cache: false
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm --filter @dfragon/web build
    # configure-pages reads the Pages site settings, which needs the pages permission.
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: apps/web/dist
