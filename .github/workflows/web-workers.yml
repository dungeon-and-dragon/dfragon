name: Web Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-workers-dev
  cancel-in-progress: false

jobs:
  # Deploys apps/web to the dev Worker, which serves dev.dfragon.com and its workers.dev address.
  # Queued runs replace each other, so quick successive merges end with the latest main.
  deploy-dev:
    if: github.repository == 'dungeon-and-dragon/dfragon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The web app's OCR needs the pinned fine-tuned model. The site never loads the score engine submodule.
      - run: git submodule update --init --depth 1 packages/models/ocr-finetuned
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          # The deployed site must not be built from package caches that other runs could have written.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # workers.dev is not an API CORS origin, so the build calls the API through the Worker's same-origin proxy.
      - run: pnpm --filter @dfragon/web build
        env:
          VITE_SAME_ORIGIN_API: 'true'
      # The dev site must stay out of search results and must not claim the production domain.
      - run: |
          rm apps/web/dist/CNAME
          printf 'User-agent: *\nDisallow: /\n' > apps/web/dist/robots.txt
          git rev-parse HEAD > apps/web/dist/version.txt
      # OCR assets go first so the deployed Worker never points at a version folder that is missing in R2.
      - working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          version="$(pnpm --silent upload:ocr --env dev)"
          pnpm exec wrangler deploy --env dev --var "OCR_ASSET_VERSION:$version"
