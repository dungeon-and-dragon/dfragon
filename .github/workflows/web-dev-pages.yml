name: Web Dev Pages

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # dev.dfragon.com is served by the dfragon-dev repository's Pages, so its deploy workflow builds main there.
  dispatch:
    if: github.repository == 'dungeon-and-dragon/dfragon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The token reaches only this step. It can run Actions in dfragon-dev and nothing in this repository.
      # Dispatches of quick successive pushes can arrive out of order, so dev builds main as of its run, not this SHA.
      - env:
          GH_TOKEN: ${{ secrets.DFRAGON_DEV_DISPATCH_TOKEN }}
        run: gh workflow run deploy.yml --repo dungeon-and-dragon/dfragon-dev --ref main -f ref=main
