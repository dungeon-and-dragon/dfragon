<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }
    </style>
  </head>
  <body class="bg-canvas text-fg">
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px">
      <button class="switch" role="switch" aria-checked="false">
        <span class="switch-thumb"></span>
      </button>
      <button class="switch" role="switch" aria-checked="true" data-checked>
        <span class="switch-thumb" data-checked></span>
      </button>
      <button class="switch" role="switch" aria-checked="false" data-disabled disabled>
        <span class="switch-thumb" data-disabled></span>
      </button>
      <button class="switch" role="switch" aria-checked="true" data-checked data-disabled disabled>
        <span class="switch-thumb" data-checked data-disabled></span>
      </button>
    </div>
  </body>
</html>
