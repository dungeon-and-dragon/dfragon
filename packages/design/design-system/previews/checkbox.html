<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }
    </style>
  </head>
  <body class="bg-canvas text-fg">
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px">
      <span class="checkbox" role="checkbox" aria-checked="false"
        ><span class="checkbox-indicator"></span></span
      >
      <span class="checkbox" role="checkbox" aria-checked="true" data-checked
        ><span class="checkbox-indicator"
          ><svg
            viewBox="0 0 16 16"
            width="12"
            height="12"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 8.5l3 3 7-7" />
          </svg></span
        ></span
      >
      <span class="checkbox" role="checkbox" aria-checked="mixed" data-indeterminate
        ><span class="checkbox-indicator"
          ><svg
            viewBox="0 0 16 16"
            width="12"
            height="12"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 8h8" />
          </svg></span
        ></span
      >
      <span class="checkbox" role="checkbox" aria-checked="true" data-checked data-disabled
        ><span class="checkbox-indicator"
          ><svg
            viewBox="0 0 16 16"
            width="12"
            height="12"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 8.5l3 3 7-7" />
          </svg></span
        ></span
      >
    </div>
  </body>
</html>
