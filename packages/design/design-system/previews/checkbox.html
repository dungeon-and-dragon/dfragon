<!-- @dsCard group="Components" height=100 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }
    </style>
  </head>
  <body class="bg-canvas text-fg">
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px">
      <span class="checkbox" role="checkbox" aria-checked="false"></span>
      <span class="checkbox" role="checkbox" aria-checked="true" data-checked>
        <span class="checkbox-indicator" data-checked>
          <svg
            viewBox="0 0 24 24"
            width="1em"
            height="1em"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="square"
            aria-hidden="true"
          >
            <path vector-effect="non-scaling-stroke" d="M20 6 9 17l-5-5" />
          </svg>
        </span>
      </span>
      <span
        class="checkbox"
        role="checkbox"
        aria-checked="false"
        aria-disabled="true"
        data-disabled
      ></span>
      <span
        class="checkbox"
        role="checkbox"
        aria-checked="true"
        aria-disabled="true"
        data-checked
        data-disabled
      >
        <span class="checkbox-indicator" data-checked data-disabled>
          <svg
            viewBox="0 0 24 24"
            width="1em"
            height="1em"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="square"
            aria-hidden="true"
          >
            <path vector-effect="non-scaling-stroke" d="M20 6 9 17l-5-5" />
          </svg>
        </span>
      </span>
    </div>
  </body>
</html>
