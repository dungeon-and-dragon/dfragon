<!-- @dsCard group="Components" height=300 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }
    </style>
  </head>
  <body class="bg-canvas text-fg">
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px">
      <button class="chip" aria-pressed="false">원본</button>
      <button class="chip" aria-pressed="true" data-pressed>장비</button>
      <button class="chip" aria-pressed="false" disabled>비활성</button>
      <button class="chip" aria-pressed="true" data-pressed disabled>선택 비활성</button>
    </div>
    <div class="chip-group" role="group" aria-label="기간">
      <button class="chip" aria-pressed="true" data-pressed>반년</button>
      <button class="chip" aria-pressed="false">분기</button>
      <button class="chip" aria-pressed="false">한 달</button>
    </div>
    <div
      class="chip-list"
      role="group"
      aria-label="마법부여"
      style="width: 288px; margin-top: 12px"
    >
      <button class="chip" aria-pressed="true" data-pressed>현재 마법부여</button>
      <span class="chip-list-label">종결</span>
      <button class="chip" aria-pressed="false">최종 데미지 증가 +2%</button>
      <button class="chip" aria-pressed="false">
        화속성 강화 +15, 명속성 강화 +15, 수속성 강화 +15, 암속성 강화 +15
      </button>
    </div>
  </body>
</html>
